 const mk=marked();
 const rows=S.papers.map(p=>{const k=Object.keys(S.att).filter(k=>k.startsWith(p.id+"_")).length,ss=S.subs.filter(s=>s.pid===p.id).length,v=mk.filter(x=>x.p.id===p.id).map(x=>+x.a.marks),avg=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
  return`<tr><td>${esc(p.title)}</td><td>${k}</td><td>${ss}</td><td>${v.length?avg.toFixed(1)+" / "+p.max:"—"}</td><td>${v.length?Math.max(...v)+" / "+Math.min(...v):"—"}</td><td><div class="meter"><i style="width:${v.length?avg/p.max*100:0}%"></i></div></td></tr>`}).join("");
 const st=totals();
 return`<div class="card scroll"><h3>Papers</h3><table><tr><th>Paper</th><th>Attempted</th><th>Submitted</th><th>Average</th><th>High / Low</th><th>Avg score</th></tr>${rows||'<tr><td colspan="6" class="mu">No data.</td></tr>'}</table></div>
 <div class="card scroll"><h3>Students</h3><table><tr><th>Student</th><th>Papers marked</th><th>Average</th><th></th></tr>${st.map(r=>`<tr><td>${esc(r.n)}</td><td>${r.c}</td><td>${(r.m/r.x*100).toFixed(1)}%</td><td><div class="meter"><i style="width:${r.m/r.x*100}%"></i></div></td></tr>`).join("")||'<tr><td colspan="4" class="mu">No marks awarded yet.</td></tr>'}</table></div>`}

function adminStudents(){
 const T=Object.fromEntries(totals().map(r=>[r.u,r]));
 return`<div class="card"><h3>Add a student</h3><div class="g" style="margin-top:12px"><div><label>Full name</label><input id="sn"></div><div><label>Username</label><input id="su"></div><div><label>Password</label><input id="sp"></div></div><div class="row sec"><button class="p" data-act="addstu">Add student</button></div></div>
 <div class="card scroll"><table><tr><th>Name</th><th>Username</th><th>New password</th><th>Avg</th><th></th></tr>${S.users.map(u=>`<tr><td><input id="n_${esc(u.id)}" value="${esc(u.name)}" style="width:140px"></td><td>${esc(u.id)}</td><td><input id="p_${esc(u.id)}" placeholder="unchanged" style="width:120px"></td><td>${T[u.id]?(T[u.id].m/T[u.id].x*100).toFixed(0)+"%":"—"}</td><td style="text-align:right;white-space:nowrap"><button data-act="stusave" data-id="${esc(u.id)}">Save</button> <button class="d" data-act="delstu" data-id="${esc(u.id)}">Remove</button></td></tr>`).join("")||'<tr><td colspan="5" class="mu">No students yet.</td></tr>'}</table></div>`}

function adminSubs(){
 return S.papers.map(p=>{const ks=Object.keys(S.att).filter(k=>k.startsWith(p.id+"_"));
 return`<div class="card scroll"><h3>${esc(p.title)} <span class="mu">· out of ${p.max}</span></h3><table><tr><th>Student</th><th>Sheet</th><th>Marks</th><th>Remarks</th><th>Visible</th><th></th></tr>${ks.map(k=>{const u=k.slice(p.id.length+1),s=S.subs.find(s=>s.id===k),a=S.adm[k]||{},e=esc(k);return`<tr><td>${esc(uname(u))}</td><td>${s?`<a href="${F("sheet",s.id)}" target="_blank" rel="noopener">Open</a>`:'<span class="mu">pending</span>'}</td>
 <td><input id="m_${e}" type="number" style="width:76px" value="${esc(a.marks==null?"":a.marks)}"></td><td><input id="r_${e}" style="width:170px" value="${esc(a.rem||"")}"></td>
 <td><button class="${a.v?"on":""}" data-act="vis" data-id="${e}">${a.v?"Shared":"Admin only"}</button></td>
 <td style="white-space:nowrap"><button data-act="marks" data-id="${e}">Save</button> <button class="d" data-act="reset" data-id="${e}">Re-attempt</button></td></tr>`}).join("")||'<tr><td colspan="6" class="mu">No attempts yet.</td></tr>'}</table></div>`}).join("")||'<p class="mu">No papers yet.</p>'}

function dates(){
 const n=Date.now(),L=[...S.sched.map(x=>({id:x.id,s:1,t:x.title,at:x.at,note:x.note})),...S.papers.filter(p=>p.st&&vis(p)).map(p=>({t:p.title+" opens",at:p.st}))].sort((a,b)=>a.at-b.at);
 return(isA()?`<div class="card"><h3>Add to datesheet</h3><div class="g" style="margin-top:12px"><div><label>Title</label><input id="dt" placeholder="e.g. Chemistry Test"></div><div><label>Date & time</label><input id="dd" type="datetime-local"></div><div><label>Note (optional)</label><input id="dn"></div></div><div class="row sec"><button class="p" data-act="adddate">Add</button></div></div>`:"")+
 `<div class="card scroll"><table><tr><th>When</th><th>Event</th><th></th></tr>${L.map(x=>`<tr style="${x.at<n?"opacity:.5":""}"><td>${fmt(x.at)}</td><td>${esc(x.t)}${x.note?`<div class="mu">${esc(x.note)}</div>`:""}</td><td style="text-align:right">${isA()&&x.s?`<button class="d" data-act="deldate" data-id="${x.id}">Delete</button>`:""}</td></tr>`).join("")||'<tr><td colspan="3" class="mu">Nothing scheduled.</td></tr>'}</table></div>`}
function notices(){
 return`<div class="card"><h3>New announcement</h3><div class="row" style="margin-top:12px"><input id="an_t" style="flex:1;min-width:220px" placeholder="Write a notice…"><button class="p" data-act="addann">Post</button></div></div>`+(S.ann.map(a=>`<div class="card row"><div class="sp"><div class="mu">${fmt(a.at)}</div>${esc(a.text)}</div><button class="d" data-act="delann" data-id="${a.id}">Delete</button></div>`).join("")||'<p class="mu">No announcements.</p>')}

function archive(){
 const on=S.set.arc!==false,n=Date.now(),list=S.papers.filter(p=>vis(p)&&(isA()||(on&&n>=p.dl)));
 return(isA()?`<div class="card row"><div class="sp"><h3>Student access</h3><div class="mu">Let students view and download papers after the deadline.</div></div><button class="${on?"on":""}" data-act="arcset">${on?"Enabled":"Disabled"}</button></div>`:(!on?'<p class="mu">The archive is currently closed by the admin.</p>':""))+
 (list.length&&(on||isA())?`<div class="row" style="margin-bottom:14px"><button class="p" data-act="zip">Download all as ZIP</button></div>`:"")+
 (list.map(p=>`<div class="card"><div class="row"><div class="sp"><h3>${esc(p.title)}</h3><div class="meta"><span>${p.max} marks</span><span>Deadline ${fmt(p.dl)}</span></div></div>
 <button data-act="arcview" data-id="${p.id}">View</button><button data-act="dl" data-id="${p.id}">Download</button>${p.kid?`<button data-act="dlk" data-id="${p.id}">Answer key</button>`:""}</div></div>`).join("")||((on||isA())?'<p class="mu">Nothing here yet. Papers appear after their deadline.</p>':""))}

function settings(){
 const m=me();
 return appearance()+`<div class="card"><h3>Site name</h3><div class="row" style="margin-top:12px"><input id="sitename" value="${esc(site())}" style="min-width:240px"><button class="p" data-act="savesite">Save</button></div></div>
 <div class="card"><h3>Admins</h3><div class="scroll" style="margin:8px 0 14px"><table><tr><th>Name</th><th>Username</th><th></th></tr>${S.admins.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.id)}</td><td style="text-align:right">${a.id===m.u?'<span class="mu">you</span>':`<button class="d" data-act="deladmin" data-id="${esc(a.id)}">Remove</button>`}</td></tr>`).join("")}</table></div>
 <div class="g"><div><label>Name</label><input id="nan"></div><div><label>Username</label><input id="nau"></div><div><label>Password</label><input id="nap"></div></div><div class="row sec"><button class="p" data-act="addadmin">Add admin</button></div></div>`}
function account(){
 const m=me(),p=pref(),A=isA();
 return`<div class="card"><h3>Profile</h3><div class="g" style="margin-top:12px"><div><label>Display name</label><input id="an" value="${esc(m.name||"")}"></div><div><label>Username${A?"":" (set by admin)"}</label><input id="au" value="${esc(m.u)}" ${A?"":"disabled"}></div><div><label>New password (blank = keep)</label><input id="ap" type="password"></div></div><div class="row sec"><button class="p" data-act="saveme">Save profile</button></div></div>
 <div class="card"><h3>Reminders</h3><div class="mu" style="margin-bottom:12px">Applies to this account only.</div><div class="row"><button class="${p.corner!==false?"on":""}" data-act="pc">Corner widget: ${p.corner!==false?"On":"Off"}</button><button class="${p.pop!==false?"on":""}" data-act="pp">Popup on open: ${p.pop!==false?"On":"Off"}</button></div></div>
 <div class="card"><h3>Signed-in accounts</h3><div class="scroll" style="margin-top:8px"><table>${accts.map((a,i)=>`<tr><td>${esc(a.name||a.u)} <span class="mu">@${esc(a.u)}${a.admin?" · admin":""}</span></td><td style="text-align:right;white-space:nowrap">${i===cur?'<span class="pill ok">Active</span>':`<button data-act="sw" data-id="${i}">Switch</button>`} <button class="d" data-act="out" data-id="${i}">Sign out</button></td></tr>`).join("")}</table></div><div class="row sec"><button data-act="add">+ Add account</button><button class="d" data-act="outall">Sign out of all</button></div></div>`}

async function blob(u){return await(await fetch(u)).blob()}
async function dlFile(u,name){try{saveBlob(await blob(u),name)}catch(e){toast("Download failed")}}
const setPref=async o=>{await C("prefs").doc(me().u).set({...pref(),...o})};

document.addEventListener("click",async ev=>{
 const b=ev.target.closest("[data-act]");if(!b)return;
 const act=b.dataset.act,id=b.dataset.id,P=S.papers.find(p=>p.id===id),m=me();
 try{
 if(act==="theme")return toggleTheme();
 if(act==="pick"){const f=b.parentElement.querySelector(".fin");if(f)f.click();return}
 if(act==="mv"){const L=PEND[b.dataset.ctx]||[],i=+b.dataset.i,j=i+ +b.dataset.d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];return refreshUp(b.dataset.ctx)}
 if(act==="rm"){const L=PEND[b.dataset.ctx]||[],x=L.splice(+b.dataset.i,1)[0];if(x&&x.url)URL.revokeObjectURL(x.url);return refreshUp(b.dataset.ctx)}
 if(act==="preset"){PREV={preset:id};applyTheme(PREV);return render(true)}
 if(act==="accclear"){PREV={preset:(themeNow()||{}).preset||"forest"};applyTheme(PREV);return render(true)}
 if(act==="themereset"){PREV={preset:"forest"};applyTheme(PREV);return render(true)}
 if(act==="themesave"){await C("set").doc("main").set({...S.set,theme:themeNow()||{preset:"forest"}});PREV=null;await load();render(true);return toast("Appearance saved")}
 if(act==="gosign"){page="signin";render(true);return scrollTo(0,0)}
 if(act==="retry"){loadErr="";lastState="";render(true);return load()}
 if(act==="gohome"){page="home";render(true);return scrollTo(0,0)}
 if(act==="goto"){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:"smooth"});return}
 if(act==="tab"){tab=id;editId=null;clearPend("paper","key");return render(true)}
 if(act==="close"){view=null;return render(true)}
 if(act==="hidec"){cornerHid=true;return render(true)}
 if(act==="closepop"){popOn=false;return render(true)}
 if(act==="nopop"){popOn=false;await setPref({pop:false});return render(true)}
 if(act==="pc"){return setPref({corner:pref().corner===false})}
 if(act==="pp"){return setPref({pop:pref().pop===false})}
 if(act==="add"){adding=true;return render(true)}
 if(act==="cancel"){adding=false;return render(true)}
 if(act==="sw"){cur=+id;save();view=null;tab="tests";editId=null;loadedOnce=false;lastState="";render(true);return load()}
 if(act==="out"){accts.splice(+id,1);if(cur>=accts.length)cur=0;else if(+id<cur)cur--;save();view=null;return render(true)}
 if(act==="outall"){accts=[];cur=0;save();return render(true)}
 if(act==="login"){const u=val("lu").toLowerCase(),p=document.getElementById("lp").value;
  const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({u,p})}),j=await r.json().catch(()=>({}));
  if(!r.ok)return toast(j.error||"Incorrect username or password");
  const a={u:j.u,admin:j.admin,name:j.name,tok:j.tok},i=accts.findIndex(x=>x.u===a.u);if(i>=0)accts[i]=a;else accts.push(a);
  cur=i>=0?i:accts.length-1;adding=false;page="home";tab="tests";loadedOnce=false;lastState="";save();render(true);return load()}
 if(act==="start"){const r=await C("att").doc(id+"_"+m.u).set({}),a={start:r.start};S.att[id+"_"+m.u]=a;view={t:P.title,u:F("paper",P.id),end:endOf(P,a)};return render(true)}
 if(act==="open"){view={t:P.title,u:F("paper",P.id),end:endOf(P,S.att[id+"_"+m.u])};return render(true)}
 if(act==="adminview"||act==="arcview"){if(!isA()&&Date.now()<P.dl)return;view={t:P.title,u:F("paper",P.id)};return render(true)}
 if(act==="upload"){const ctx="sheet:"+id;if(!(PEND[ctx]||[]).length)return toast("Add your answer sheet first");if(!S.att[id+"_"+m.u])return;
  b.disabled=true;try{await uploadCtx("sheet",id,ctx)}catch(e){b.disabled=false;throw e}await load();return toast("Answer sheet submitted")}
 if(act==="newp"){clearPend("paper","key");editId="new";return render(true)}
 if(act==="editp"){clearPend("paper","key");editId=id;return render(true)}
 if(act==="cancelp"){clearPend("paper","key");editId=null;return render(true)}
 if(act==="savepaper"){const t=val("pt"),s=val("ps"),d=val("pd"),hasP=(PEND.paper||[]).length,hasK=(PEND.key||[]).length;
  if(!t||!d)return toast("Title and deadline are required");if(!hasP&&!(P&&P.hasPdf))return toast("Add the question paper first");
  const st=s?new Date(s).getTime():0,dlv=new Date(d).getTime();if(st&&st>=dlv)return toast("Opening time must be before the deadline");
  const all=document.getElementById("pall").checked,to=all?null:[...document.querySelectorAll(".pto:checked")].map(x=>x.value);
  if(!all&&!to.length)return toast("Select at least one student");
  b.disabled=true;b.textContent="Saving…";const pn=P?P.id:Date.now().toString(36);
  await C("papers").doc(pn).set({title:t,mins:+val("pm")||60,max:+val("px")||100,st,dl:dlv,to});
  try{if(hasP)await uploadCtx("paper",pn,"paper");if(hasK)await uploadCtx("key",pn,"key")}catch(e){editId=pn;await load();throw e}
  clearPend("paper","key");editId=null;await load();toast("Paper saved");return render(true)}
 if(act==="delpaper"){if(!P)return;await C("papers").doc(id).delete();return toast("Paper deleted")}
 if(act==="addstu"){const n=val("sn"),u=val("su").toLowerCase(),p=val("sp");if(!n||!u||!p)return toast("Fill in all fields");await C("users").doc(u).set({name:n,pw:p});return toast("Student saved")}
 if(act==="stusave"){const x=S.users.find(x=>x.id===id);await C("users").doc(id).set({name:val("n_"+id)||x.name,pw:document.getElementById("p_"+id).value});return toast("Student updated")}
 if(act==="delstu"){await C("users").doc(id).delete();return toast("Student removed")}
 if(act==="marks"){await C("adm").doc(id).set({...(S.adm[id]||{}),marks:val("m_"+id),rem:val("r_"+id)});return toast("Saved")}
 if(act==="vis"){await C("adm").doc(id).set({...(S.adm[id]||{}),v:!(S.adm[id]||{}).v});return}
 if(act==="reset"){await C("att").doc(id).delete();await C("subs").doc(id).delete();await C("adm").doc(id).delete();return toast("Attempt reset. The student can start again.")}
 if(act==="adddate"){const t=val("dt"),d=val("dd");if(!t||!d)return toast("Title and date are required");await C("sched").doc(Date.now().toString(36)).set({title:t,at:new Date(d).getTime(),note:val("dn")});return toast("Added")}
 if(act==="deldate"){await C("sched").doc(id).delete();return}
 if(act==="addann"){const t=val("an_t");if(!t)return;await C("ann").doc(Date.now().toString(36)).set({text:t,at:Date.now()});return toast("Posted")}
 if(act==="delann"){await C("ann").doc(id).delete();return}
 if(act==="arcset"){await C("set").doc("main").set({...S.set,arc:S.set.arc===false});return}
 if(act==="savesite"){const v=val("sitename");if(!v)return toast("Enter a name");await C("set").doc("main").set({...S.set,site:v});return toast("Site name updated")}
 if(act==="addadmin"){const n=val("nan"),u=val("nau").toLowerCase(),p=val("nap");if(!n||!u||!p)return toast("Fill in all fields");await C("admins").doc(u).set({name:n,pw:p});return toast("Admin added")}
 if(act==="deladmin"){await C("admins").doc(id).delete();return toast("Admin removed")}
 if(act==="saveme"){const n=val("an")||m.name,p=document.getElementById("ap").value;
  if(m.admin){const u=val("au").toLowerCase();if(!u)return toast("Username can't be empty");
   if(u!==m.u&&!p)return toast("Set a new password when changing username");
   const j=await C("admins").doc(u).set({name:n,pw:p,from:m.u});if(j.tok){m.tok=j.tok}m.u=u}
  else await C("me").doc(m.u).set({name:n,pw:p});
  m.name=n;save();await load();return toast("Profile updated")}
 if(act==="dl"&&P)return dlFile(F("paper",P.id),P.title+".pdf");
 if(act==="dlk"&&P)return dlFile(F("key",P.id),P.title+" - key.pdf");
 if(act==="zip"){if(!window.JSZip)return toast("ZIP is unavailable here");const z=new JSZip(),n=Date.now();b.disabled=true;b.textContent="Preparing…";
  for(const p of S.papers.filter(p=>vis(p)&&(isA()||n>=p.dl))){z.file(p.title.replace(/[\\/:*?"<>|]/g,"_")+".pdf",await blob(F("paper",p.id)));if(p.kid)z.file(p.title.replace(/[\\/:*?"<>|]/g,"_")+" - key.pdf",await blob(F("key",p.id)))}
  saveBlob(await z.generateAsync({type:"blob"}),site()+" papers.zip");return render(true)}
 }catch(e){toast("Error: "+(e&&e.message||"something went wrong"));render(true)}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="lp")document.querySelector('[data-act="login"]').click()});
</script></body></html>
